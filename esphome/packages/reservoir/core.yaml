# Per-reservoir setpoints. Every reservoir bundle includes this.
#
# Choosing a crop profile (reservoir/crop_profile.yaml, generated from
# crops/crops.yaml) writes the pH target, pH alarm band and EC limits here. All
# setpoints can also be tuned by hand.
#
# Vars: res, res_name
# Provides: ${res}_ph_target, ${res}_ph_deadband, ${res}_ph_alarm_band,
#           ${res}_ec_low, ${res}_ec_high, ${res}_water_temp_high
#
# Initial values only apply on first boot, before a crop profile is chosen. Min and
# max limits must stay in step with PH_LIMITS and EC_LIMITS in tools/gen_crop_profiles.py.

number:
  - platform: template
    id: ${res}_ph_target
    name: "${res_name} pH target"
    entity_category: config
    mode: box
    optimistic: true
    restore_value: true
    min_value: 5.0
    max_value: 7.5
    step: 0.05
    initial_value: 6.0
    unit_of_measurement: "pH"

  - platform: template
    id: ${res}_ph_deadband
    name: "${res_name} pH dosing deadband"
    entity_category: config
    mode: box
    optimistic: true
    restore_value: true
    min_value: 0.05
    max_value: 1.0
    step: 0.05
    initial_value: 0.15
    unit_of_measurement: "pH"

  - platform: template
    id: ${res}_ph_alarm_band
    name: "${res_name} pH alarm band"
    entity_category: config
    mode: box
    optimistic: true
    restore_value: true
    min_value: 0.1
    max_value: 2.0
    step: 0.05
    initial_value: 0.5
    unit_of_measurement: "pH"

  - platform: template
    id: ${res}_ec_low
    name: "${res_name} EC low limit"
    entity_category: config
    mode: box
    optimistic: true
    restore_value: true
    min_value: 0.0
    max_value: 6.0
    step: 0.05
    initial_value: 2.5
    unit_of_measurement: "mS/cm"

  - platform: template
    id: ${res}_ec_high
    name: "${res_name} EC high limit"
    entity_category: config
    mode: box
    optimistic: true
    restore_value: true
    min_value: 0.0
    max_value: 6.0
    step: 0.05
    initial_value: 3.5
    unit_of_measurement: "mS/cm"

  - platform: template
    id: ${res}_water_temp_high
    name: "${res_name} water temperature limit"
    entity_category: config
    mode: box
    optimistic: true
    restore_value: true
    min_value: 15.0
    max_value: 30.0
    step: 0.5
    initial_value: 24.0
    unit_of_measurement: "°C"
    device_class: temperature
