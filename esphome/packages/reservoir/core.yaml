# Per-reservoir setpoints and crop profile. Every reservoir bundle includes this.
#
# Choosing a crop profile writes its values into the setpoint numbers below. The
# numbers can then be fine-tuned by hand; the profile select keeps showing the last
# profile applied. Profile values are documented in docs/crop-profiles.md, and this
# file is their source of truth.
#
# Vars: res, res_name
# Provides: ${res}_profile, ${res}_ph_target, ${res}_ph_deadband, ${res}_ph_alarm_band,
#           ${res}_ec_low, ${res}_ec_high, ${res}_water_temp_high

select:
  - platform: template
    id: ${res}_profile
    name: "${res_name} crop profile"
    entity_category: config
    optimistic: true
    restore_value: true
    options:
      - "Seedling"
      - "Tomato - vegetative"
      - "Tomato - fruiting"
      - "Pepper"
      - "Brassica"
    initial_option: "Tomato - fruiting"
    # set_action runs only when the profile is changed, not when it is restored at
    # boot, so hand-tuned setpoints survive a reboot.
    set_action:
      - lambda: |-
          float ph, ec_lo, ec_hi;
          if (x == "Seedling")                 { ph = 6.0f; ec_lo = 0.6f; ec_hi = 1.2f; }
          else if (x == "Tomato - vegetative") { ph = 6.0f; ec_lo = 1.8f; ec_hi = 2.5f; }
          else if (x == "Tomato - fruiting")   { ph = 6.0f; ec_lo = 2.5f; ec_hi = 3.5f; }
          else if (x == "Pepper")              { ph = 6.0f; ec_lo = 1.8f; ec_hi = 2.8f; }
          else if (x == "Brassica")            { ph = 6.3f; ec_lo = 2.5f; ec_hi = 3.2f; }
          else return;
          auto apply = [](number::Number *n, float v) {
            auto call = n->make_call();
            call.set_value(v);
            call.perform();
          };
          apply(id(${res}_ph_target), ph);
          apply(id(${res}_ec_low), ec_lo);
          apply(id(${res}_ec_high), ec_hi);
          ESP_LOGI("profile", "${res_name}: applied profile '%s'", x.c_str());

# Initial values match the "Tomato - fruiting" profile and only apply on first boot.
number:
  - platform: template
    id: ${res}_ph_target
    name: "${res_name} pH target"
    entity_category: config
    mode: box
    optimistic: true
    restore_value: true
    min_value: 5.0
    max_value: 7.5
    step: 0.05
    initial_value: 6.0
    unit_of_measurement: "pH"

  - platform: template
    id: ${res}_ph_deadband
    name: "${res_name} pH dosing deadband"
    entity_category: config
    mode: box
    optimistic: true
    restore_value: true
    min_value: 0.05
    max_value: 1.0
    step: 0.05
    initial_value: 0.15
    unit_of_measurement: "pH"

  - platform: template
    id: ${res}_ph_alarm_band
    name: "${res_name} pH alarm band"
    entity_category: config
    mode: box
    optimistic: true
    restore_value: true
    min_value: 0.1
    max_value: 2.0
    step: 0.05
    initial_value: 0.5
    unit_of_measurement: "pH"

  - platform: template
    id: ${res}_ec_low
    name: "${res_name} EC low limit"
    entity_category: config
    mode: box
    optimistic: true
    restore_value: true
    min_value: 0.0
    max_value: 6.0
    step: 0.05
    initial_value: 2.5
    unit_of_measurement: "mS/cm"

  - platform: template
    id: ${res}_ec_high
    name: "${res_name} EC high limit"
    entity_category: config
    mode: box
    optimistic: true
    restore_value: true
    min_value: 0.0
    max_value: 6.0
    step: 0.05
    initial_value: 3.5
    unit_of_measurement: "mS/cm"

  - platform: template
    id: ${res}_water_temp_high
    name: "${res_name} water temperature limit"
    entity_category: config
    mode: box
    optimistic: true
    restore_value: true
    min_value: 15.0
    max_value: 30.0
    step: 0.5
    initial_value: 24.0
    unit_of_measurement: "°C"
    device_class: temperature
